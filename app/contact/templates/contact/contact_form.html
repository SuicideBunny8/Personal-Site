{% extends "base.html" %}

{% block title %}
    Contact Me
{% endblock %}

{% block head %}
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'contact/style.css' %}" />
{% endblock head %}

{% block content %}
    <div class="wrapper center">
        <form action="{% url 'contact_page' %}" method="post">
            {% csrf_token %}
            <table>
                {{ form.as_table }}
            </table>
            <button type="submit">Send Message</button>
        </form>
    </div>
{% endblock %}
