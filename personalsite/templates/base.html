<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noarchive">
        <meta name="author" content="{% block author %}Emela Moreyra{% endblock %}">
        <meta name="description" content="{% block description %}Description{% endblock %}">
        <title>{% block title %}Tab Title{% endblock %}</title>
        {% load static %}
        <link rel="stylesheet" type="text/css" href="{% static 'style.css' %}" />
        <link rel="shortcut icon" type="image/x-icon" href="{% static 'favicon.svg' %}">
        <script src="{% static 'script.js' %}" defer></script>
    </head>

    <body>
        <div class="wrapper">
            <div class="nav-bar box">
                <div class="box">
                    <div class="box"><a href="{% url 'homepage' %}"><img src="{% static 'E_Logo_1200.webp' %}" class="logo"></a></div>
                    <div class="box col">
                        <a href="{% url 'homepage' %}"><h1>Emela Moreyra</h1></a>
                        <div class="wordmark box row">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
                <div class="nav-menu box">
                    <div class="nav-item box col">
                        <a href="{% url 'homepage' %}"><h2>Home</h2></a>
                    </div>
                    <div class="nav-item box col">
                        <a href="{% url 'post_list_view' %}"><h2>Posts</h2></a>
                    </div>
                    <div class="nav-item box col">
                        <a href="{% url 'about' %}"><h2>About</h2></a>
                    </div>
                    <div class="nav-item box col">
                        <a href="{% url 'contact_page' %}"><h2>Contact</h2></a> {# old mailto link mailto:emelavm@gmail.com #}
                    </div>
                </div>
                <div>
                    <a href="#" class="menu-icon">
                        <span></span>
                        <span class="mid-bar"></span>
                        <span></span>
                    </a>
                </div>
            </div>
            
            <div class="wrapper center"><div class="content">
                {% block content %}
                    <em>Oops! No Content Found</em>
                {% endblock content %}
            </div>
            
            <footer class="footer">
                <div class="box wrapper center">
                    <div class="box row">
                         <a href="https://www.linkedin.com/in/emoreyra/"><img title="LinkedIn" alt="LinkedIn Logo" src="{% static 'linkedin.png' %}" class="social"></a><!--Icon made by Pixel perfect from www.flaticon.com -->
                        <a href="https://github.com/SuicideBunny8"><img title="GitHub" alt="GitHub Logo" src="{% static 'github.png' %}" class="social"></a><!--Icon made by Pixel perfect from www.flaticon.com -->
                        <a href="mailto:{{ ADMIN_EMAIL }}"><img title="Email" alt="Email Icon" src="{% static 'envelope.png' %}" class="social"></a><!--Icon made by Pixel perfect from www.flaticon.com -->
                        {# <a href="#"><img title="Buy Me a Coffee" alt="Coffee Icon" src="{% static 'coffee.png' %}" class="social"></a>--><!--Icon made by Pixel perfect from www.flaticon.com --> #}
                    </div>
                    &copy; {% now "Y" %} Emela Moreyra
                </div>
            </footer></div>
            
        </div>
    </body>
</html>
