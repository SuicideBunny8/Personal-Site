# production nginx config
upstream django_prod {
    server unix:/run/gunicorn/personalsite.sock;
}

server {
    listen 80;
    server_name emelavm.com www.emelavm.com;

    # -- Static files (collected by manage.py collectstatic) --
    location /resources/ {
        alias /var/www/personalsite/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # -- Media files: proxy to Garage web endpoint --
    location /media/ {
        proxy_pass http://127.0.0.1:3902/;
        proxy_set_header Host "personal-site-bucket.web.garage.localhost";
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
    }

    # -- Everything else: proxy to Gunicorn --
    location / {
        proxy_pass http://django_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
