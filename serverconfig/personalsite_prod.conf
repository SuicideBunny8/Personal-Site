# production nginx config
upstream django_prod {
    server unix:/run/gunicorn/personalsite.sock;
}


# Reject non-approved hosts
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/emelavm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emelavm.com/privkey.pem;
    return 444;
}


# HTTPS redirect
server {
    listen 80;
    server_name emelavm.com www.emelavm.com;

    return https://$host$request_uri;
}

# Main Server Block
server {
    listen 443 ssl;
    server_name emelavm.com www.emelavm.com;

    ssl_certificate /etc/letsencrypt/live/emelavm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emelavm.com/privkey.pem;

    # TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Static files
    location /resources/ {
        alias /var/www/personalsite/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Media files: proxy to Garage web endpoint
    location /media/ {
        proxy_pass http://127.0.0.1:3902/;
        proxy_set_header Host "personal-site-bucket.web.garage.localhost";
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
    }

    # Everything else: proxy to Gunicorn
    location / {
        proxy_pass http://django_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
